<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tracker diagnostics</title>
<!-- Deliberately NOT installable and deliberately not precached: this page has to
     stay readable when the app shell is the thing under suspicion. The service
     worker only answers navigations to the app's own URL, so this one always comes
     off the network. Add it to the home screen the same way as the app to read the
     standalone numbers, which are the ones that matter for the safe area. -->
<!-- Its own manifest, with `display: standalone` exactly like the app's. Without
     one, Add to Home Screen falls back to iOS's LEGACY standalone path — the page
     reports `navigator.standalone: true` but `display-mode: browser`, which is a
     different code path from the app and so measures the wrong thing. -->
<link rel="manifest" href="diag.webmanifest">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: max(12px, env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
  }
  h1 { font: 600 15px/1.3 ui-sans-serif, -apple-system, sans-serif; margin: 0 0 12px; }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 3px 0; vertical-align: top; border-bottom: 1px solid rgba(128,128,128,.2); }
  td:first-child { color: #888; padding-right: 10px; white-space: nowrap; }
  td:last-child { text-align: right; word-break: break-all; }
  .bad  { color: #c0392b; font-weight: 600; }
  .good { color: #1e8449; font-weight: 600; }
  button {
    font: inherit; margin: 14px 6px 0 0; padding: 9px 12px;
    border: 1px solid rgba(128,128,128,.4); border-radius: 8px; background: none;
    color: inherit; cursor: pointer;
  }
  /* A band pinned to the very bottom of the layout viewport. If any colour shows
     BELOW this on screen, that area is outside the viewport and no CSS in this
     document can reach it — which is the whole question. */
  #edge {
    position: fixed; left: 0; right: 0; bottom: 0; height: 4px;
    background: #eb6834;
  }
</style>
</head>
<body>
<h1>Tracker diagnostics</h1>
<table id="out"></table>
<button id="nudge">Re-assert viewport-fit</button>
<button id="reset">Clear caches + unregister worker</button>
<button id="reload">Reload</button>
<div id="edge"></div>

<script>
const rows = [];
const add = (k, v, cls = '') => rows.push([k, v, cls]);

// The safe-area insets, read the only way that actually works: put them on a real
// element and ask what came out. `env()` is not visible to getComputedStyle on the
// custom property itself.
const probe = document.createElement('div');
probe.id = 'probe';
probe.style.cssText =
  'position:fixed;padding:env(safe-area-inset-top) env(safe-area-inset-right)' +
  ' env(safe-area-inset-bottom) env(safe-area-inset-left);visibility:hidden';
document.body.append(probe);
const cs = getComputedStyle(probe);
const insetBottom = cs.paddingBottom;

const mode = ['standalone', 'fullscreen', 'minimal-ui', 'browser']
  .find(m => matchMedia(`(display-mode: ${m})`).matches) || 'unknown';

// Which load of this app session this is. The whole question is whether the
// viewport changes shape between the FIRST paint after launch and every one after
// it, so the page has to say which it is rather than rely on anyone remembering.
// sessionStorage is per-app-launch on iOS, so a cold start resets it to 1.
const loads = Number(sessionStorage.getItem('loads') || 0) + 1;
sessionStorage.setItem('loads', String(loads));
add('load # this launch', loads + (loads === 1 ? '  (fresh launch)' : '  (after reload)'));

add('display-mode', mode, mode === 'standalone' ? 'good' : 'bad');
add('navigator.standalone', String(window.navigator.standalone));
add('safe-area top', cs.paddingTop);
add('safe-area bottom', insetBottom, parseFloat(insetBottom) > 0 ? 'good' : '');
add('innerHeight', innerHeight);
add('documentElement.clientHeight', document.documentElement.clientHeight);
add('visualViewport.height', visualViewport ? Math.round(visualViewport.height) : 'n/a');
add('screen.height', screen.height);
add('devicePixelRatio', devicePixelRatio);

// The number that settles it: how much CSS height sits below the layout viewport.
// Anything much over 0 is dead space that no stylesheet in the app can paint, which
// is exactly the white band. (screen.height is in CSS px on iOS, not device px.)
const dead = screen.height - innerHeight;
add('screen.height - innerHeight', dead, dead > 0 ? 'bad' : 'good');

(async () => {
  // Which index.html the app would actually open — the whole point. If the cached
  // copy still carries `apple-mobile-web-app-capable`, the fix never landed and the
  // white band is explained without any further theorising.
  try {
    const names = await caches.keys();
    add('caches', names.join(', ') || '(none)');
    let html = null;
    for (const n of names.filter(n => n.startsWith('shell'))) {
      const c = await caches.open(n);
      const r = await c.match('./', { ignoreSearch: true }) || await c.match('index.html');
      if (r) { html = await r.text(); add('shell serving', n); break; }
    }
    if (html) {
      const capable = /name="apple-mobile-web-app-capable"/.test(html)
        && !/NOT `apple-mobile-web-app-capable`/.test(html);
      add('cached html has capable meta', String(capable), capable ? 'bad' : 'good');
      add('cached html has manifest', String(/rel="manifest"/.test(html)));
    } else {
      add('shell serving', '(no cached index found)');
    }
  } catch (e) {
    add('caches', 'error: ' + e.message, 'bad');
  }

  const reg = await navigator.serviceWorker?.getRegistration();
  add('worker', reg ? (reg.active ? 'active' : 'registered') : 'none');
  add('worker scope', reg ? reg.scope : 'n/a');

  add('userAgent', navigator.userAgent);

  document.getElementById('out').innerHTML = rows.map(([k, v, c]) =>
    `<tr><td>${k}</td><td class="${c}">${String(v).replace(/[<&]/g, s => s === '<' ? '&lt;' : '&amp;')}</td></tr>`
  ).join('');
})();

// The candidate fix, on a button so it can be tried here before it goes anywhere
// near the app. iOS appears to drop `viewport-fit=cover` on any load that is not
// the first of a launch; rewriting the meta forces the viewport to be evaluated
// again. If `screen.height - innerHeight` falls to 0 after tapping this — and the
// orange bar reaches the bottom of the screen — that is the fix.
document.getElementById('nudge').onclick = () => {
  const vp = document.querySelector('meta[name="viewport"]');
  const base = vp.getAttribute('content');
  vp.setAttribute('content', base.replace('viewport-fit=cover', 'viewport-fit=contain'));
  requestAnimationFrame(() => {
    vp.setAttribute('content', base);
    // Two frames: one for the change to take, one for the layout it causes.
    requestAnimationFrame(() => {
      document.getElementById('nudge').textContent =
        `after nudge: dead ${screen.height - innerHeight}px, ` +
        `bottom inset ${getComputedStyle(probe).paddingBottom}`;
    });
  });
};

document.getElementById('reset').onclick = async () => {
  for (const n of await caches.keys()) await caches.delete(n);
  for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
  document.getElementById('reset').textContent = 'Cleared — now reopen the app';
};
document.getElementById('reload').onclick = () => location.reload();
</script>
</body>
</html>
