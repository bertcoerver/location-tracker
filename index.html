<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Location Tracker</title>
<script src="https://unpkg.com/deck.gl@9.3.7/dist.min.js"></script>
<style>
  :root {
    color-scheme: light dark;

    --surface-1:      #fcfcfb;
    --surface-2:      rgba(252, 252, 251, 0.88);
    --border:         rgba(11, 11, 11, 0.12);
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #83817b;
    --accent:         #eb6834;
    --shadow:         0 1px 2px rgba(11,11,11,.08), 0 8px 24px rgba(11,11,11,.10);

    /* Sequential ramp, oldest -> newest. Validated (ordinal, light surface):
       monotone L, adjacent dL >= .06, light end 2.06:1, hue spread 4 deg. */
    --ramp-0: #86b6ef;
    --ramp-1: #5598e7;
    --ramp-2: #2a78d6;
    --ramp-3: #184f95;
    --ramp-4: #0d366b;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      --surface-1:      #1a1a19;
      --surface-2:      rgba(26, 26, 25, 0.88);
      --border:         rgba(255, 255, 255, 0.14);
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #8f8e85;
      --accent:         #d95926;
      --shadow:         0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.5);

      /* Same hue, stepped for the dark surface; oldest is the dimmest. */
      --ramp-0: #184f95;
      --ramp-1: #2a78d6;
      --ramp-2: #5598e7;
      --ramp-3: #9ec5f4;
      --ramp-4: #cde2fb;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 13px/1.45 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text-primary);
    background: var(--surface-1);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #map { position: fixed; inset: 0; }

  .panel {
    position: fixed;
    background: var(--surface-2);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
  }

  #status {
    top: max(12px, env(safe-area-inset-top));
    left: max(12px, env(safe-area-inset-left));
    padding: 10px 13px;
    min-width: 176px;
    max-width: calc(100vw - 24px);
  }
  #status h1 {
    margin: 0 0 5px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  #count {
    font-variant-numeric: tabular-nums;
    font-size: 21px;
    font-weight: 600;
    line-height: 1.15;
    letter-spacing: -.01em;
  }
  #count small { font-size: 12px; font-weight: 500; color: var(--text-secondary); }
  #updated {
    margin-top: 3px;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #dot {
    width: 6px; height: 6px; flex: none;
    border-radius: 50%;
    background: var(--text-muted);
    transition: background .2s;
  }
  body[data-state="loading"] #dot { background: var(--ramp-2); animation: pulse 1.1s ease-in-out infinite; }
  body[data-state="ok"]      #dot { background: #1baf7a; }
  body[data-state="error"]   #dot { background: #e34948; }
  @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .25 } }

  #run-picker { margin-top: 8px; }
  #run-picker[hidden] { display: none; }
  #run {
    font: inherit;
    width: 100%;
    padding: 5px 7px;
    color: var(--text-primary);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 7px;
    cursor: pointer;
  }
  #run:hover { border-color: var(--text-muted); }

  #error {
    margin-top: 7px;
    padding-top: 7px;
    border-top: 1px solid var(--border);
    color: #c0392b;
    max-width: 260px;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) #error { color: #e66767; }
  }
  #error:empty { display: none; }

  #legend {
    bottom: max(12px, env(safe-area-inset-bottom));
    left: max(12px, env(safe-area-inset-left));
    padding: 9px 11px;
  }
  #legend .bar {
    height: 7px;
    width: 132px;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--ramp-0), var(--ramp-1), var(--ramp-2), var(--ramp-3), var(--ramp-4));
  }
  #legend .ends {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 5px;
    color: var(--text-secondary);
    font-size: 11px;
  }

  #follow {
    bottom: max(12px, env(safe-area-inset-bottom));
    right: max(12px, env(safe-area-inset-right));
    padding: 8px 12px;
    font: inherit;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  #follow::before {
    content: "";
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text-muted);
  }
  #follow[aria-pressed="true"] { color: var(--text-primary); }
  #follow[aria-pressed="true"]::before { background: var(--accent); }
  #follow:hover { border-color: var(--text-muted); }

  .tip {
    font: inherit;
    padding: 9px 11px !important;
    border-radius: 9px !important;
    background: var(--surface-2) !important;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    color: var(--text-primary) !important;
    max-width: 260px;
  }
  .tip .t { font-weight: 600; margin-bottom: 3px; }
  .tip .r {
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .tip .m {
    margin-top: 5px; padding-top: 5px;
    border-top: 1px solid var(--border);
    white-space: normal;
  }
  .tip img { display: block; margin-top: 6px; max-width: 100%; border-radius: 5px; }

  @media (max-width: 560px) {
    #legend { display: none; }
  }
</style>
</head>
<body data-state="loading">

<div id="map"></div>

<div id="status" class="panel">
  <h1 id="title">Location Tracker</h1>
  <div id="count">&mdash;</div>
  <div id="updated"><span id="dot"></span><span id="updated-text">Loading&hellip;</span></div>
  <div id="run-picker" hidden>
    <select id="run" aria-label="Run"></select>
  </div>
  <div id="error"></div>
</div>

<div id="legend" class="panel" aria-hidden="true">
  <div class="bar"></div>
  <div class="ends"><span>Oldest</span><span>Newest</span></div>
</div>

<button id="follow" class="panel" type="button" aria-pressed="true">Follow latest</button>

<script type="module" src="src/main.js"></script>
</body>
</html>
