<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Location Tracker</title>
<script src="https://unpkg.com/deck.gl@9.3.7/dist.min.js"></script>
<style>
  :root {
    color-scheme: light dark;

    --surface-1:      #fcfcfb;
    --surface-2:      rgba(252, 252, 251, 0.88);
    --border:         rgba(11, 11, 11, 0.12);
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #83817b;
    --accent:         #eb6834;
    /* The course. Deliberately off the blue ramp — the route is context, and it
       must never be mistaken for a reading. */
    --course:         #7b6cc4;
    --shadow:         0 1px 2px rgba(11,11,11,.08), 0 8px 24px rgba(11,11,11,.10);

    /* How much of the bottom of the window the profile strip is covering. Both
       are set by profile.js from config.js; everything anchored to the bottom
       of the window reads --profile-h so nothing can disagree about it. */
    --profile-h: 0px;
    --profile-min-w: 640px;

    /* Every ping, one colour. Age used to be encoded in a ramp; it isn't any
       more, because the panel now says how old the newest fix is and that is
       the only part of the answer anyone was reading off the colours. */
    --point: #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      --surface-1:      #1a1a19;
      --surface-2:      rgba(26, 26, 25, 0.88);
      --border:         rgba(255, 255, 255, 0.14);
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #8f8e85;
      --accent:         #d95926;
      --course:         #a99af0;
      --shadow:         0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.5);

      /* Same hue, lifted for the dark surface. */
      --point:          #5598e7;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 13px/1.45 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text-primary);
    background: var(--surface-1);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #map { position: fixed; inset: 0; }

  .panel {
    position: fixed;
    background: var(--surface-2);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
  }

  #status {
    top: max(12px, env(safe-area-inset-top));
    left: max(12px, env(safe-area-inset-left));
    padding: 10px 13px;
    min-width: 176px;
    max-width: calc(100vw - 24px);
  }
  #status h1 {
    margin: 0 0 5px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  /* The picker marks live runs too, but someone with a single run never opens
     it — this is where they see that the tracker is actually moving. */
  #live {
    display: inline-block;
    width: 6px; height: 6px;
    margin-left: 5px;
    vertical-align: 1px;
    border-radius: 50%;
    background: #1baf7a;
    animation: pulse 2.2s ease-in-out infinite;
  }
  #live[hidden] { display: none; }
  /* The one reading on the page, and the control that flies back to it. There
     is no separate Follow button any more: the thing you want to look at and
     the way to go there are the same thing. */
  #ticker {
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.01em;
    display: flex;
    align-items: center;
    gap: 7px;
    width: 100%;
    padding: 0;
    background: none;
    border: 0;
    text-align: left;
    color: var(--text-secondary);
    cursor: pointer;
  }
  #ticker[aria-pressed="true"] { color: var(--text-primary); }
  #ticker:hover { color: var(--text-primary); }
  #ticker:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  #dot {
    width: 6px; height: 6px; flex: none;
    border-radius: 50%;
    background: var(--text-muted);
    transition: background .2s;
  }
  body[data-state="loading"] #dot { background: var(--point); animation: pulse 1.1s ease-in-out infinite; }
  body[data-state="ok"]      #dot { background: #1baf7a; }
  body[data-state="error"]   #dot { background: #e34948; }
  @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .25 } }

  #run-picker { margin-top: 8px; }
  #run-picker[hidden] { display: none; }
  #run {
    font: inherit;
    width: 100%;
    padding: 5px 7px;
    color: var(--text-primary);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 7px;
    cursor: pointer;
  }
  #run:hover { border-color: var(--text-muted); }

  #error {
    margin-top: 7px;
    padding-top: 7px;
    border-top: 1px solid var(--border);
    color: #c0392b;
    max-width: 260px;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) #error { color: #e66767; }
  }
  #error:empty { display: none; }

  /* --- the height profile ------------------------------------------------ */
  /* An overlay, so the map keeps its full height and a run without a course
     looks exactly as it did before this existed. */
  #profile {
    left: 0; right: 0;
    bottom: 0;
    height: calc(var(--profile-h) + env(safe-area-inset-bottom, 0px));
    padding: 0;
    border-radius: 0;
    border-left: 0; border-right: 0; border-bottom: 0;
    overflow: hidden;
  }
  #profile[hidden] { display: none; }
  /* On a phone the strip would compress a 20 km course into 375 px of mush, so
     below --profile-min-w it keeps its width and pans instead. */
  #profile-scroll {
    height: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    overscroll-behavior-x: contain;
  }
  #profile-canvas {
    display: block;
    height: var(--profile-h);
    width: max(100%, var(--profile-min-w));
  }
  #profile-readout {
    position: absolute;
    top: 6px; right: 10px;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
    font-size: 11px;
    pointer-events: none;
  }

  .tip {
    font: inherit;
    padding: 9px 11px !important;
    border-radius: 9px !important;
    background: var(--surface-2) !important;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    color: var(--text-primary) !important;
    max-width: 260px;
  }
  .tip .t { font-weight: 600; margin-bottom: 3px; }
  .tip .r {
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .tip .m {
    margin-top: 5px; padding-top: 5px;
    border-top: 1px solid var(--border);
    white-space: normal;
  }
  .tip img { display: block; margin-top: 6px; max-width: 100%; border-radius: 5px; }

  /* The profile's tooltip. Same `.tip` skin as the map's, but positioned by us:
     deck.gl isn't involved, and the canvas sits inside a horizontally scrolled
     container, so canvas coordinates are not page coordinates. Fixed, and sitting
     ON TOP of the strip rather than below it, where there is no room. */
  #profile-tip {
    position: fixed;
    z-index: 2;
    bottom: calc(var(--profile-h) + env(safe-area-inset-bottom, 0px) + 8px);
    pointer-events: none;
  }
  #profile-tip[hidden] { display: none; }
</style>
</head>
<body data-state="loading">

<div id="map"></div>

<div id="status" class="panel">
  <h1 id="title">
    <span id="title-text">Location Tracker</span>
    <span id="live" title="Pinged within the last hour" hidden></span>
  </h1>
  <button id="ticker" type="button" aria-pressed="true" title="Fly to the latest ping">
    <span id="dot"></span><span id="ticker-text">Loading&hellip;</span>
  </button>
  <div id="run-picker" hidden>
    <select id="run" aria-label="Run"></select>
  </div>
  <div id="error"></div>
</div>

<div id="profile" class="panel" hidden>
  <div id="profile-scroll"><canvas id="profile-canvas"></canvas></div>
  <div id="profile-readout"></div>
</div>
<div id="profile-tip" class="tip" hidden></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
