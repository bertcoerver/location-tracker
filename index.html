<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Location Tracker</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- No `<meta name="theme-color">`. It is the one thing in this head that diag.html
     did not have, and diag.html was the version that launched full-screen: same
     manifest-driven standalone, same `black-translucent`, 0 px of dead screen
     against this page's 59. A theme colour asks iOS to paint the status bar, while
     `black-translucent` asks it to put the page under one, and asking for both
     appears to cost `viewport-fit=cover` — the viewport comes back a status bar
     shorter, pinned to the top, leaving a band along the bottom that is outside
     the layout viewport and that no stylesheet can reach.
     The manifest still carries `theme_color` for the platforms that read it. -->
<!-- Deliberately NOT `apple-mobile-web-app-capable`: it opts into iOS's legacy
     standalone mode, where `display-mode` reads `browser` and the manifest is
     ignored. The manifest's `display: standalone` has driven standalone since iOS
     15.4 and is the path that honours `viewport-fit=cover`. (Measured on a phone:
     on the legacy path the viewport loses the status bar's height on every load
     after the first. On the manifest path it survives.) -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tracker">

<!-- Vendored rather than pulled from unpkg. It is 1.6 MB and it is the one thing
     between opening the page and seeing a map, so it has to be precacheable — and
     a cross-origin script comes back opaque, which a Cache cannot store. -->
<script src="vendor/deck.gl-9.3.7.min.js"></script>
<style>
  :root {
    color-scheme: light dark;

    --surface-1:      #fcfcfb;
    /* Every panel: the status box and the height strip. One value, because they
       are two windows onto the same map and reading as two different materials
       made the page look assembled rather than designed. Frosted rather than
       merely translucent — the heavy blur in `.panel` is what does that, and it
       is why the alpha can stay low enough to see the course underneath. */
    --surface-2:      rgba(252, 252, 251, 0.75);
    --border:         rgba(11, 11, 11, 0.12);
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #83817b;
    --accent:         #eb6834;
    /* The course. Deliberately off the blue ramp — the route is context, and it
       must never be mistaken for a reading. */
    --course:         #7b6cc4;
    --shadow:         0 1px 2px rgba(11,11,11,.08), 0 8px 24px rgba(11,11,11,.10);

    /* How much of the bottom of the window each of the two bottom overlays is
       covering: the height strip, set by profile.js, and the news bar above it,
       set by news.js — both from config.js. Everything anchored to the bottom of
       the window adds BOTH so nothing can disagree about where the bottom is.
       Either may be 0px, and both are always set rather than removed: a missing
       custom property makes a calc() invalid rather than making it zero. */
    --profile-h: 0px;
    --news-h: 0px;
    --profile-min-w: 640px;

    /* Every ping is `--accent`. There used to be a `--point` blue for the older
       ones and the accent for the newest, which said "these are two kinds of
       thing" about one kind of thing — the pings are one reading, and which of
       them is newest is said by the halo and the size instead. Age used to be a
       ramp with a legend, and the panel says how old the newest fix is in words,
       which is all anyone was decoding the colours for. */

    /* Where the PERSON LOOKING at the page is, which is the one mark here that
       isn't about the race at all. Blue because a blue dot means "you" on every
       map anyone has ever used — and the one thing on screen that isn't orange,
       which is now the whole distinction from a ping. The colour doesn't carry
       it alone: see `viewerLayers` for the ring and the halo. */
    --viewer: #1a73e8;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      --surface-1:      #1a1a19;
      --surface-2:      rgba(26, 26, 25, 0.75);
      --border:         rgba(255, 255, 255, 0.14);
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #8f8e85;
      --accent:         #d95926;
      --course:         #a99af0;
      --shadow:         0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.5);

      /* Same hue, lifted for the dark surface. */
      --viewer:         #4a9eff;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 13px/1.45 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text-primary);
    background: var(--surface-1);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #map { position: fixed; inset: 0; }

  /* Frosted glass. The saturate is not decoration: a blur this heavy averages
     the basemap towards grey, and lifting saturation back up is what keeps the
     map underneath looking like a map rather than like fog. */
  .panel {
    position: fixed;
    /* Nothing in either panel is prose. Every press on one is aimed at a control
       or at the chart, and on iOS an unclaimed press instead starts a text
       selection: the magnifying lens comes up and Safari highlights whatever
       word it can reach — reliably one from the status box, while the finger was
       on the height strip entirely. The tooltips opt back in below, since the
       numbers in those are worth copying. */
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    background: var(--surface-2);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
  }

  #status {
    top: max(12px, env(safe-area-inset-top));
    left: max(12px, env(safe-area-inset-left));
    padding: 10px 13px;
    min-width: 176px;
    max-width: calc(100vw - 24px);
  }
  /* The dot and the ping age sit ABOVE the run name: "is it still going" is the
     live signal and belongs at the top, and the name is the headline under it
     rather than a label over it. */
  #head {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    /* No gap: the course block carries the same margin-top as the clock and the
       finish, and a gap here would add to it for that one block only. */
    gap: 0;
  }
  /* The course name is one of the three `.v` values — see that rule. It cannot
     simply wear the class: it is a <select> stretched over a sizer, and the two
     pixels of border and padding that gives it have to be taken back off here
     or the name would sit two pixels lower and one pixel further right than the
     clock underneath it. */
  #status h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 500;
    line-height: 1.2;
    color: var(--text-primary);
    /* It holds the run picker, its sizer, and the chevron over them both. */
    position: relative;
    /* Block, not inline-block, and that is an alignment fix rather than a layout
       one: an inline-block sits on a text baseline and drags the line box's
       descender space along under it, which put four more pixels between the run
       name and "ELAPSED" than there are between the clock and "FINISH". It still
       shrinks to the sizer's width — its parent is a flex item in a column that
       aligns to flex-start, so the block fills a box already measured by the
       widest thing in it. */
    display: block;
    /* Cancels the sizer's left padding AND its border, so the name starts on the
       same pixel column as the two values below it while the control still has
       somewhere to draw that border.
       Deliberately NO `max-width: 100%` here: this margin makes the heading
       measure 7 px narrower than it wants, the panel shrinks to that, and a
       percentage cap would then resolve against the smaller answer and clip the
       name by exactly those 7 px. The sizer below is capped instead, in units
       that don't depend on the box being measured. */
    margin-left: -7px;
    /* `.v` sits 1 px under its caption; the select's own border and padding
       already account for 2 px of that. */
    margin-top: -1px;
  }
  /* The sizer, and the reason the heading is built this way at all.
     A <select> is laid out from the browser's own metrics rather than from the
     width of its option text, so at 20 px it comes out several pixels too narrow
     and quietly clips the end of a longer run name. This span carries the same
     string at the same type, gives the heading its width, and the control is
     stretched over it. Invisible, never read aloud, purely a ruler. */
  #title-text {
    display: block;
    padding: 1px 22px 1px 6px;
    /* The control has one, and the two box models have to match to the pixel or
       the ruler is short by exactly the border and the name clips again. */
    border: 1px solid transparent;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    visibility: hidden;
    /* The one cap on how wide a run name may make this panel. In viewport units
       rather than a percentage, so it cannot depend on the width it is deciding.
       Leaves room for the panel's own padding and its margin from the edge, so
       an absurd name ellipsizes here rather than pushing the box off screen. */
    max-width: calc(100vw - 80px);
  }
  /* The ping age, and the control that flies back to it. There is no separate
     Follow button: the thing you want to look at and the way to get there are
     the same thing. */
  #ticker {
    font: inherit;
    font-size: 12px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0;
    background: none;
    border: 0;
    color: var(--text-muted);
    cursor: pointer;
  }
  #ticker[aria-pressed="true"] { color: var(--text-secondary); }
  #ticker:hover { color: var(--text-primary); }
  #ticker:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

  /* One dot, saying two things at once: colour is whether the last poll worked,
     and it pulses while the run is live. Two separate dots side by side just
     read as decoration. */
  #dot {
    width: 6px; height: 6px; flex: none;
    border-radius: 50%;
    background: var(--text-muted);
    transition: background .2s;
  }
  body[data-state="ok"]      #dot,
  body[data-state="loading"] #dot { background: #1baf7a; }
  body[data-state="error"]   #dot { background: #e34948; }
  body[data-state="loading"] #dot,
  #dot[data-live="true"]     { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: .25 } }

  /* The race clock: time since the gun, or since the first ping when the course
     filename named no gun, or a countdown while the gun is still ahead. Ticks
     while the run is live and freezes at the total once it goes quiet — a clock
     still counting after the finish claims the race is still on. Inside the
     status panel: it is one more fact about the run on screen, and a whole
     second panel for two lines was a lot of window to spend on it. */
  /* The three readings in this panel — the course, the elapsed clock and the
     predicted finish — are one shape said three times: a caption, then a value.
     Three rules, not nine: they used to be typeset separately and had drifted
     into three different sizes, two inks and two indents, which made a panel of
     equal facts look like a hierarchy nobody meant.
     `.v` also gets tabular figures throughout — the clock needs them or every
     second shuffles the digits sideways, and a run name is unaffected by them. */
  #course-block, #clock, #finish { margin-top: 6px; }
  #clock[hidden], #finish[hidden] { display: none; }
  /* "(DNF)" behind the total. Inside the value so it sits on the same line as the
     digits, but typeset down to the caption's size and ink: the time is the
     reading, this is a note about it, and at 20px it would have read as a second
     number. */
  #clock-dnf { font-size: 12px; font-weight: 600; color: var(--text-muted); }
  #clock-dnf[hidden] { display: none; }
  .k {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .v {
    font-variant-numeric: tabular-nums;
    font-size: 20px;
    font-weight: 500;
    line-height: 1.2;
    margin-top: 1px;
    color: var(--text-primary);
  }
  /* What the course IS, under what it is called: "165 km · 9,900 m". Typeset like
     the finish's range — small, quiet, tabular — because it is the same kind of
     line: a qualifier under a headline rather than a reading of its own. */
  #course-figures {
    font-variant-numeric: tabular-nums;
    font-size: 11px;
    line-height: 1.4;
    margin-top: 1px;
    color: var(--text-muted);
  }
  #course-figures[hidden] { display: none; }
  /* The one thing under a value that isn't one: the finish's range, which is what
     stops the number above it being read as a promise. The clock's "since" line
     is the same shape and shares the rule — a duration is only half a fact until
     something says what it is measured against. */
  #finish-range, #clock-since {
    font-variant-numeric: tabular-nums;
    font-size: 11px;
    line-height: 1.4;
    color: var(--text-muted);
  }

  /* The run picker IS the heading. There used to be a name and, underneath it, a
     dropdown listing that same name — the same word twice, one of them inert.
     Now there is one control: at rest it is typeset exactly as the h1 was, and
     it grows a border and a chevron only when pointed at, so it stops looking
     like a widget until you go looking for one. */
  #run {
    /* Laid over the sizer, so the two always agree about how wide the name is. */
    position: absolute;
    inset: 0;
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
    font: inherit;
    font-size: 20px;
    font-weight: 500;
    line-height: 1.2;
    color: var(--text-primary);
    background: transparent;
    /* Reserved in the layout even when invisible, so the name does not shift
       sideways by a pixel the moment the cursor arrives. */
    border: 1px solid transparent;
    border-radius: 7px;
    /* Matches the sizer's, so the visible text lands exactly where it measured. */
    padding: 1px 22px 1px 6px;
    /* Only reachable by a name long enough to hit the sizer's cap. Without it
       such a name ends on a half-drawn letter, which reads as a rendering bug
       rather than as "there is more of this". */
    text-overflow: ellipsis;
    cursor: pointer;
  }
  #run:hover, #run:focus-visible {
    border-color: var(--border);
    background: var(--surface-1);
  }
  /* A disabled select is greyed by the browser. This one is disabled only
     because there is nothing to choose, and it is still the heading — it has to
     look identical whether or not a second run exists. */
  #run:disabled {
    color: var(--text-primary);
    opacity: 1;
    cursor: default;
  }
  #title::after {
    content: '⌄';
    position: absolute;
    right: 5px;
    /* The glyph hangs low in its own em box, so centring it needs a nudge above
       the halfway line rather than exactly on it. */
    top: 50%;
    transform: translateY(-68%);
    font-size: 15px;
    line-height: 1;
    color: var(--text-muted);
    pointer-events: none;
    /* Always there, and faint. It used to appear only on hover, which on a phone
       means never — the picker was invisible, and a control nobody can find is
       the same as one that doesn't exist. At this weight it reads as a hint next
       to a 20 px heading rather than as a widget attached to it, and pointing at
       it still brings it up to full strength. */
    opacity: .4;
    transition: opacity .15s;
  }
  #title:hover::after, #title:focus-within::after { opacity: .85; }
  /* One run is not a choice: no chevron, no hover border, nothing to promise. */
  #title[data-single="true"]::after { content: none; }
  #title[data-single="true"] #run:hover { border-color: transparent; background: transparent; }

  /* How the request for the visitor's own position is getting on — see
     `geoMessage`. There is no control it can hang off any more: the page asks on
     load, so the only thing left to say is why there is no blue dot when there
     isn't one. Empty in the ordinary case, and `:empty` is what stops it
     reserving a line for nothing. */
  #viewer-note {
    margin-top: 6px;
    font-size: 11px;
    color: var(--text-muted);
  }
  #viewer-note:empty { display: none; }

  #error {
    margin-top: 7px;
    padding-top: 7px;
    border-top: 1px solid var(--border);
    color: #c0392b;
    max-width: 260px;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) #error { color: #e66767; }
  }
  #error:empty { display: none; }

  /* --- the height profile ------------------------------------------------ */
  /* An overlay, so the map keeps its full height and a run without a course
     looks exactly as it did before this existed. */
  #profile {
    left: 0; right: 0;
    bottom: 0;
    height: calc(var(--profile-h) + env(safe-area-inset-bottom, 0px));
    padding: 0;
    border-radius: 0;
    border-left: 0; border-right: 0; border-bottom: 0;
    overflow: hidden;
  }
  #profile[hidden] { display: none; }
  /* The strip is wider than the window whenever the course is long enough to
     need it — see `stripWidth` in profile.js — and then this pans it. */
  #profile-scroll {
    height: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    overscroll-behavior-x: contain;
    /* No scrollbar. On the platforms that lay one out it eats into a 112 px
       strip, and on the ones that overlay it it sits directly on top of the
       distance labels. The fades below say the same thing from the margins. */
    scrollbar-width: none;
  }
  #profile-scroll::-webkit-scrollbar { display: none; }
  /* "There is more course this way." Only the end that HAS more fades, so this
     also says which way to go — which is the half of a scrollbar worth keeping. */
  #profile::before, #profile::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    width: 28px;
    z-index: 1;
    pointer-events: none;
    opacity: 0;
    transition: opacity .18s;
  }
  #profile::before { left: 0;  background: linear-gradient(to right, var(--surface-2), transparent); }
  #profile::after  { right: 0; background: linear-gradient(to left,  var(--surface-2), transparent); }
  #profile[data-more-left="true"]::before,
  #profile[data-more-right="true"]::after { opacity: 1; }
  #profile-canvas {
    display: block;
    height: var(--profile-h);
    width: max(100%, var(--profile-min-w));
  }
  /* Dragging a pinned point along the course. `touch-action: none` is what makes
     it work on a phone: without it the strip's own horizontal scroll claims the
     gesture and the marker never moves. */
  #profile[data-dragging="true"] #profile-canvas { touch-action: none; cursor: grabbing; }

  /* --- the news bar ------------------------------------------------------- */
  /* Directly on top of the height strip, and an overlay like it, so a run with
     nothing to say looks exactly as it did before this existed.

     One `bottom` expression covers both cases, which is why the safe-area term is
     here as well as inside #profile's height. With the strip up, #profile has
     already absorbed the inset and --profile-h alone stacks this on it; with the
     strip hidden (display:none, above) nothing is consuming the inset and the
     env() is what keeps the bar off the home indicator. */
  #news {
    left: 0; right: 0;
    bottom: calc(var(--profile-h) + env(safe-area-inset-bottom, 0px));
    height: var(--news-h);
    padding: 0 14px;
    border-radius: 0;
    border-left: 0; border-right: 0; border-bottom: 0;
    display: flex;
    align-items: center;
    /* One line, always — see news.js. */
    overflow: hidden;
    font-size: 13px;
    line-height: 1;
    color: var(--text-secondary);
  }
  #news[hidden] { display: none; }
  #news a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  #news code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .92em; }
  #news strong { font-weight: 600; color: var(--text-primary); }

  #news-track { display: flex; white-space: nowrap; }
  /* Two copies, and the gap carried INSIDE each one as its own margin. That is
     what lets the animation be a bare -50%: half of a two-copy track is exactly
     one copy, so the restart lands copy 1 where copy 2 was and the join is
     invisible — with no measured pixel anywhere in it. Only the DURATION comes
     from JS, so the text crosses at one speed whatever it says. */
  .news-copy { margin-right: var(--news-gap, 96px); }
  #news[data-marquee="true"] #news-track {
    animation: news-scroll var(--news-dur, 20s) linear infinite;
    /* The blur lives on #news (via .panel) and the transform on the track inside
       it, deliberately. Animating a transform on the backdrop-filtered element
       itself recomputes a 20px blur over a live deck.gl canvas every frame, which
       is a phone-killer and flickers on WebKit. Promoting the track keeps the
       blurred region still and composites only the text. */
    will-change: transform;
    transform: translateZ(0);
  }
  @keyframes news-scroll { to { transform: translateX(-50%); } }
  /* Short enough to fit: centred, and the second copy has nothing to do. */
  #news[data-marquee="false"] #news-track { width: 100%; justify-content: center; }
  #news[data-marquee="false"] .news-copy { margin-right: 0; }
  #news[data-marquee="false"] .news-copy + .news-copy { display: none; }
  /* `prefers-reduced-motion` arrives here as data-marquee="false" on a message too
     long to fit — see `marqueeState`. Killing the animation alone would truncate it
     with no way to reach the rest, so the bar becomes scrollable by hand instead,
     with the same fades the height strip uses to say there is more. */
  @media (prefers-reduced-motion: reduce) {
    #news { overflow-x: auto; scrollbar-width: none; justify-content: flex-start; }
    #news::-webkit-scrollbar { display: none; }
    #news[data-marquee="false"] #news-track { width: auto; }
  }
  #news::before, #news::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    width: 28px;
    z-index: 1;
    pointer-events: none;
    opacity: 0;
    transition: opacity .18s;
  }
  #news::before { left: 0;  background: linear-gradient(to right, var(--surface-2), transparent); }
  #news::after  { right: 0; background: linear-gradient(to left,  var(--surface-2), transparent); }
  #news[data-more-left="true"]::before,
  #news[data-more-right="true"]::after { opacity: 1; }

  .tip {
    font: inherit;
    /* Opting back in: a tooltip is the one thing on screen with numbers in it
       somebody might want to copy. */
    -webkit-user-select: text;
    user-select: text;
    padding: 9px 11px !important;
    border-radius: 9px !important;
    background: var(--surface-2) !important;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    color: var(--text-primary) !important;
    max-width: 260px;
  }
  /* The top line, laid out like a phone's status bar: what this is on the left, how
     the handset was doing on the right. Flex with `space-between` rather than a float
     or a grid, because the right-hand group is optional — a ping from before those
     fields existed leaves the title sitting exactly where it did. */
  .tip .t {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    /* Closed by a rule of its own, like every other band. The status bar is a
       different kind of statement from the readings under it — what the handset was
       doing, not what the runner was — and it was the one band running straight on
       into the next. */
    margin-bottom: 6px;
    padding-bottom: 5px;
    border-bottom: 1px solid var(--border);
  }
  .tip .t .i { margin-right: 5px; }
  /* Battery and signal. Quieter and lighter than the time they share the line with:
     they are the state of a phone, and the reading is the time. */
  .tip .st {
    display: flex;
    align-items: center;
    gap: 7px;
    flex: none;
    font-size: 11px;
    font-weight: 400;
    color: var(--text-secondary);
  }
  .tip .st .c { display: flex; align-items: center; gap: 3px; }
  /* Sized in `em` so the drawn icons track the line they sit on, at the same visual
     weight as the emoji elsewhere. `width: auto` with the viewBox doing the work, so
     the battery stays wider than the signal without either being told a number. */
  .tip .ic { height: .85em; width: auto; display: block; }

  /* The weather: one glyph, the temperature, the phone's own word for the sky. Set
     apart from the numbers by being the one line here in a different voice — larger
     glyph, letter-spaced label, no tabular figures — because it is the only reading on
     the card that nothing about the run produced. */
  /* Closed by a rule of its own, like the status bar above it: the weather is a third
     kind of statement, neither the handset nor the run, and it was leaning against the
     figures it is only the setting for.

     Tighter than the other bands on purpose, and it is the one band that can afford to
     be: a single centred line needs less room to read as its own thing than a block of
     rows does, and at the same 6 px either side it took as much height as three
     readings. The line-height is part of that — 1.45 is set for prose, and this is four
     words. */
  .tip .wx {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 5px;
    line-height: 1.2;
    margin: -1px 0 4px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 12px;
  }
  .tip .wx .i { font-size: 1.1em; }
  .tip .wt { font-variant-numeric: tabular-nums; color: var(--text-primary); }
  .tip .wl { letter-spacing: .02em; font-style: italic; }
  /* "+1" — which day of the race a time falls on. Raised and quietened, so it reads
     as an annotation on the time rather than as part of it: "09:12+1" at full weight
     is a number nobody can parse at a glance.
     Not scoped to `.tip`: the panel's estimated finish carries the same tag for the
     same reason, and one rule in ems raises it correctly at both sizes. */
  .d {
    font-size: .8em;
    vertical-align: .25em;
    margin-left: 1px;
    color: var(--text-muted);
  }
  .tip .r {
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* One reading: a glyph, the answer, and quietly beside it the context.
     A grid rather than a flex row so the glyphs form a column and every answer starts
     at the same x — which is what makes five rows scannable instead of five sentences.
     The third column takes the remaining width, so the "since last" figures align
     down their own left edge too. */
  .tip .row {
    display: grid;
    grid-template-columns: 1.5em max-content 1fr;
    align-items: baseline;
    column-gap: 7px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  /* Emoji come from the system font at whatever size it likes; a step down is what
     keeps them from out-weighing the numbers they label. */
  .tip .i { font-size: .9em; }
  .tip .row .i { text-align: center; }
  .tip .row .p { color: var(--text-primary); }
  .tip .s { color: var(--text-muted); font-size: 11px; }
  /* Time and distance. The two figures somebody opened the tooltip for, so they carry
     the weight and everything below them reads as qualifying one of the two — which
     is the whole difference between a hierarchy and a list. */
  .tip .row.big .p { font-size: 14px; font-weight: 600; }

  /* Predictions, fenced off. Everything above this border was measured and
     everything below it is a guess, and the border is the only thing on the tooltip
     that says which is which. */
  /* Centred, because what is inside it is a diagram and not a list: the predicted
     time, the bar it sits in the middle of, the two edges at the two ends of that bar,
     and the width underneath. Every part lines up with the part it describes. */
  .tip .pred {
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid var(--border);
    text-align: center;
    /* How wide the diagram is, and it is a FIXED number rather than the width of the
       card. The bar's whole claim is that a given fill means a given number of minutes
       — see `uncertaintyRefMs` — and a track that stretched to fit the card broke it in
       the quietest possible way: "09:01" and "23:45⁺¹" are different numbers of
       characters, so the same window drew a slightly different length on two tooltips.
       The bar and the row of edge times share this, or the times stop labelling the
       ends of the thing above them. */
    --pred-w: 186px;
  }
  .tip .pred .k { margin-bottom: 1px; }
  /* Leading the card, which is where a hover tooltip puts it: no rule above it, and
     one below closing it off from the ground it describes. */
  .tip .pred:first-child {
    margin-top: 0;
    padding-top: 0;
    border-top: none;
    margin-bottom: 6px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  /* The window's two edges at the two ends of the bar above them, with the distance
     between them written in the middle — where it reads as the gap those two numbers
     describe rather than as a third figure underneath a pair. */
  .tip .edges {
    display: flex;
    justify-content: space-between;
    width: var(--pred-w);
    margin: 0 auto;
    gap: 8px;
    font-size: 11px;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }
  .tip .edges .wide { color: var(--text-muted); }
  /* The race clock at the predicted moment. An ordinary reading row, which is what
     puts it back on the left margin at full weight — the same way a ping states the
     elapsed time it measured. Only the diagram above it is a diagram. */
  .tip .pred .row { margin-top: 3px; text-align: left; }
  /* The one number here worth reading first. Deliberately smaller than the panel's
     `.v` — a tooltip is not the panel, and 20 px inside a 260 px box shouts. */
  .tip .pv {
    font-size: 15px;
    font-weight: 500;
    line-height: 1.25;
    font-variant-numeric: tabular-nums;
    color: var(--text-primary);
    white-space: nowrap;
  }
  /* How wide the window is, as a length — the only thing in a tooltip readable
     without reading. Scaled to a fixed span (`uncertaintyRefMs`), so the same fill
     always means the same number of minutes. */
  .tip .bar {
    height: 3px;
    width: var(--pred-w);
    margin: 4px auto 3px;
    border-radius: 2px;
    background: var(--border);
    overflow: hidden;
    /* Centred, so the fill grows outwards from the predicted time above it rather
       than rightwards from a left edge that means nothing. */
    display: flex;
    justify-content: center;
  }
  .tip .bar > i {
    display: block;
    height: 100%;
    border-radius: 2px;
    background: var(--accent);
  }
  .tip .m {
    margin-top: 5px; padding-top: 5px;
    border-top: 1px solid var(--border);
    white-space: normal;
  }
  .tip img { display: block; margin-top: 6px; max-width: 100%; border-radius: 5px; }
  /* The one thing in a tooltip you can click. Both tooltips have to opt out of
     `pointer-events: none` for this to be reachable — deck.gl's default style
     sets it, and #profile-tip used to. */
  /* Always fenced off from whatever is above it. Every other band on the card is
     closed by a rule, and the link was the one thing that ran straight on from the
     readings — which left the last row reading as part of the link's own block. */
  .tip .g {
    display: block;
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--accent);
    text-decoration: none;
  }
  .tip .g:hover { text-decoration: underline; }

  /* The profile's tooltip. Same `.tip` skin as the map's, but positioned by us:
     deck.gl isn't involved, and the canvas sits inside a horizontally scrolled
     container, so canvas coordinates are not page coordinates. Fixed, and sitting
     ON TOP of the strip rather than below it, where there is no room. */
  #profile-tip {
    position: fixed;
    z-index: 2;
    bottom: calc(var(--profile-h) + var(--news-h) + env(safe-area-inset-bottom, 0px) + 8px);
    /* Deliberately NOT `none`: the Google Maps link inside has to be clickable,
       and reaching it means moving the cursor off the canvas and into here.
       profile.js allows exactly that move and dismisses on any other. */
  }
  #profile-tip[hidden] { display: none; }

  /* The pinned tooltip: the one that stays up after a click. Placed in client
     coordinates by whichever view was clicked — the map re-projects its anchor
     every frame so it rides along with a pan, and the strip follows its scroll.
     Above the map tooltip's own z-index, since only one of them is ever up. */
  #pin {
    position: fixed;
    z-index: 3;
    pointer-events: auto;
  }
  #pin[hidden] { display: none; }
</style>
</head>
<body data-state="loading">

<div id="map"></div>

<div id="status" class="panel">
  <div id="head">
    <button id="ticker" type="button" aria-pressed="true" title="Fly to the latest ping">
      <span id="dot"></span><span id="ticker-text">Loading&hellip;</span>
    </button>
    <div id="course-block">
      <div class="k">Course</div>
      <!-- The heading and the run picker are one control; ui.js fills both in.
           The span is a hidden sizer — see the CSS — not a second copy of the name. -->
      <h1 id="title" data-single="true">
        <span id="title-text" aria-hidden="true"></span>
        <select id="run" aria-label="Course"></select>
      </h1>
      <!-- How far and how much climbing, under the name rather than beside it:
           it is the same fact as the name — what this course IS — and a second
           captioned block would have put it among the readings, which are all
           about what is happening right now. -->
      <div id="course-figures" hidden></div>
    </div>
  </div>
  <!-- Then the same shape twice more: a caption and a value. The clock counts
       what has happened and the finish guesses what is left, which is one
       question asked forwards and backwards, so the two are typeset alike and
       only the range under the second says it is a guess. -->
  <div id="clock" hidden>
    <div id="clock-label" class="k">Elapsed</div>
    <!-- The total, and — when the course ran out from under a runner who never
         sent a finish — "(DNF)" behind it. A tag rather than a caption change:
         the number is still the time on the clock when it stopped, and this says
         what kind of ending it was. Quiet and small so it reads as a note on the
         figure rather than as part of it. -->
    <div class="v"><span id="clock-time">0:00:00</span><span id="clock-dnf" hidden> (DNF)</span></div>
    <!-- What the number is measured against: "since Thu 30 Jul, 09:00", or
         "until" it before the gun. Typeset like the finish's range, because it
         is the same kind of line — a small qualifier under a big number. -->
    <div id="clock-since"></div>
  </div>
  <div id="finish" hidden>
    <!-- "Estimated", not "Finish". The box only ever appears while the run is
         live, so every time in it is a guess — and saying so in the caption is
         what lets the value below be a plain time. It used to carry a "~", which
         put the hedge on the number itself where it had to fight the tabular
         figures for room. -->
    <div class="k">Estimated finish</div>
    <div id="finish-time" class="v"></div>
    <div id="finish-range"></div>
  </div>
  <div id="viewer-note"></div>
  <div id="error"></div>
</div>

<!-- Between the height strip and the map, and an overlay on both. Two copies of
     the message, because that is what makes a scrolling one loop seamlessly —
     see news.js. The second is aria-hidden so it isn't read twice. -->
<div id="news" class="panel" role="region" aria-label="Course news" hidden>
  <div id="news-track">
    <span class="news-copy"></span>
    <span class="news-copy" aria-hidden="true"></span>
  </div>
</div>

<div id="profile" class="panel" hidden>
  <div id="profile-scroll"><canvas id="profile-canvas"></canvas></div>
</div>
<div id="profile-tip" class="tip" hidden></div>
<div id="pin" class="tip" hidden></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
