<!--
  The finish: a flag, planted on the last fix of a finished race.

  The drawing is from SVG Repo (svgrepo.com), used as supplied — the path below is
  its `d` verbatim, so replacing this mark with another download is swapping one
  line. An outline pennant rather than the chequered flag this used to be: the
  chequers were made of opacity, and at map size six squares average into a smudge
  that says nothing. One clean silhouette says "finish" at every size.

  One ink, tinted on the way to the screen (see src/glyphs.js), so the colour the
  path states is thrown away and only the shape survives.

  The group is what fits a downloaded drawing to this grid, and it does two things:

    scale     the art occupies roughly x 5..19, y 4..20 of its own 24-grid, so it
              is grown to fill 1..23 here. Without this the mark would draw at
              two-thirds the size every other icon does.
    translate the foot of the pole is put near the BOTTOM-LEFT corner, because that
              corner is what layers.js anchors the flag to the fix by. A drawing
              whose pole sits in the middle of its grid would fly beside the last
              position instead of standing on it.

  `stroke-width` is pre-divided by the scale so the stroke comes out at the 2 the
  other four marks use, rather than at the 2.75 the scale would otherwise make it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     color="#000" fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
  <g transform="translate(-6.05 -4.5) scale(1.375)" stroke-width="1.4545">
    <path d="M6 13V5.5C6 5.2643 6 5.14645 6.07322 5.07322C6.14645 5 6.2643 5 6.5
             5H10.382C10.6827 5 10.833 5 10.9538 5.07467C11.0747 5.14935 11.1419
             5.28383 11.2764 5.55279L11.7236 6.44721C11.8581 6.71617 11.9253
             6.85065 12.0462 6.92533C12.167 7 12.3173 7 12.618 7H17.5C17.7357 7
             17.8536 7 17.9268 7.07322C18 7.14645 18 7.2643 18 7.5V14.5C18 14.7357
             18 14.8536 17.9268 14.9268C17.8536 15 17.7357 15 17.5 15H12.618C12.3173
             15 12.167 15 12.0462 14.9253C11.9253 14.8507 11.8581 14.7162 11.7236
             14.4472L11.2764 13.5528C11.1419 13.2838 11.0747 13.1493 10.9538
             13.0747C10.833 13 10.6827 13 10.382 13H6ZM6 13V19"/>
  </g>
</svg>
