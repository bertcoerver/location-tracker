<!--
  Sunset: the moon coming up out of the horizon.

  A MOON rather than a sun going down, and the arrow points up here too. What the
  runner cares about at this moment is not that the sun has set but that the night
  has started and the head torch goes on — so the mark says what is rising, which
  is also what makes it unmistakable beside sunrise.svg at 19 px.

  One ink, tinted on the way to the screen. See sunrise.svg for the rest.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     color="#000" fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
  <!-- The moon, its lower horn still behind the horizon. A whole crescent rather
       than the cap the sun opposite is drawn as, and that is a decision worth
       keeping: a crescent CUT at the horizon is a thin curved sliver, and at 19 px
       a thin curved sliver is a wave. The moon has to stand up out of the line to
       be a moon. Two arcs of one radius — the disc, and the shadow across it. -->
  <path d="M6.48 11.76a4.6 4.6 0 1 0 5.54 6.58 4.6 4.6 0 0 1-5.54-6.58Z"
        fill="currentColor" stroke="none"/>
  <!-- The horizon. -->
  <path d="M2 20h20"/>
  <!-- Rising, the same arrow as the sunrise: both marks are about something
       coming up over the edge of the world. -->
  <path d="M18 17.5V8.4M14.9 11.5 18 8.4l3.1 3.1"/>
</svg>
