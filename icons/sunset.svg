<!--
  Sunset: the moon coming up out of the horizon.

  A MOON rather than a sun going down, and the arrow points up here too. What the
  runner cares about at this moment is not that the sun has set but that the night
  has started and the head torch goes on — so the mark says what is rising, which
  is also what makes it unmistakable beside sunrise.svg.

  Same horizon and the same arrow in the same place as sunrise.svg, so the pair
  differs in exactly one thing. One ink, tinted on the way to the screen. See
  sunrise.svg for the rest.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     color="#000" fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
  <!-- The moon, its foot still behind the horizon. A whole crescent rather than
       the half-disc the sun opposite is drawn as, and that is a decision worth
       keeping: a crescent CUT at the horizon is a thin curved sliver, and at this
       size a thin curved sliver is a wave. The moon has to stand up out of the line
       to be a moon. Two arcs of one radius — the disc, and the shadow across it. -->
  <path d="M10.23 12.63a5 5 0 1 0 6.45 6.45 5 5 0 0 1-6.45-6.45Z"
        fill="currentColor" stroke="none"/>
  <!-- The horizon. -->
  <path d="M2 22h20"/>
  <!-- Rising, the same arrow as the sunrise: both marks are about something
       coming up over the edge of the world. -->
  <path d="M12 10.2V3.4M9.2 6.2 12 3.4l2.8 2.8"/>
</svg>
