<!--
  Sunrise: the sun coming up out of the horizon.

  Drawn on a 24x24 grid in one ink, because that is all the app can render — every
  mark is tinted to the page's own palette on the way to the screen (see
  src/glyphs.js), so any colour stated here is thrown away and only the SHAPE and
  its opacity survive. Keep drawings inside about 1..23 so the halo has room.

  Stacked, not shouldered: the arrow is directly ABOVE the sun. That is what makes
  the mark one thing rather than two things side by side, and it is why the scene
  below is only the bottom half of the grid.

  There is NO vertical ray, and that is not an oversight. With the arrow overhead a
  twelve-o-clock ray and the arrow's tail line up into one continuous stem, and the
  whole mark stops being a sunrise and starts being an anchor. Four rays on the
  diagonals instead, well clear of the disc, leaving the centre line to the arrow.

  Paired with sunset.svg: same horizon, same arrow in the same place, and what is
  RISING is the one thing that tells the two apart at a glance. Change one, look at
  the other.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     color="#000" fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
  <!-- The sun, sunk into the horizon: a half-disc centred on the line, so the line
       itself covers the flat of it and what shows is the half that has risen. -->
  <path d="M6 22a6 6 0 0 1 12 0Z" fill="currentColor" stroke="none"/>
  <!-- Four rays, at 20 and 45 degrees either side. Set two units off the disc so
       the gap survives being drawn at twenty pixels — rays touching the disc
       thicken it into a lump rather than reading as light. -->
  <path d="M6.3 16.3 5.1 15.1M17.7 16.3 18.9 15.1M4.5 19.3 2.8 18.7M19.5 19.3 21.2 18.7"/>
  <!-- The horizon. -->
  <path d="M2 22h20"/>
  <!-- Rising, which is the whole point of the mark: this is the moment the light
       comes back, not merely a picture of a sun. -->
  <path d="M12 10.2V3.4M9.2 6.2 12 3.4l2.8 2.8"/>
</svg>
