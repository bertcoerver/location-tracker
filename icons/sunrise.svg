<!--
  Sunrise: the sun coming up out of the horizon.

  Drawn on a 24x24 grid in one ink, because that is all the app can render — every
  mark is tinted to the page's own palette on the way to the screen (see
  src/glyphs.js), so any colour stated here is thrown away and only the SHAPE and
  its opacity survive. Keep drawings inside about 1..23 so the halo has room.

  Paired with sunset.svg: same horizon, same rising arrow, and the rays are the
  one thing that tells the two apart at 19 px. Change one, look at the other.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     color="#000" fill="none" stroke="currentColor" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
  <!-- The sun, sunk into the horizon: a disc centred on the line, so the line
       itself covers the bottom of it and what shows is the half that has risen. -->
  <path d="M2.5 21a5.5 5.5 0 0 1 11 0Z" fill="currentColor" stroke="none"/>
  <!-- Three rays. Only the top half of the compass, so they stay clear of both
       the horizon below and the arrow to the right. -->
  <path d="M8 14v-2M3.1 16.1 1.7 14.7M12.9 16.1 14.3 14.7"/>
  <!-- The horizon. -->
  <path d="M2 20h20"/>
  <!-- Rising, which is the whole point of the mark: this is the moment the light
       comes back, not merely a picture of a sun. -->
  <path d="M18 17.5V8.4M14.9 11.5 18 8.4l3.1 3.1"/>
</svg>
